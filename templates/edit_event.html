{% extends "base.html" %}

{% block title %}
Edit Event - EventSphere
{% endblock %}


{% block content %}

<div class="page-container">

    <!-- HEADER -->

    <div class="dashboard-header">

        <div>

            <p class="section-label">
                EVENT MANAGEMENT
            </p>

            <h1>
                Edit Event
            </h1>

            <p>
                Update the details of your event.
            </p>

        </div>

    </div>


    <!-- EDIT EVENT FORM -->

    <div class="card">

        <form
            method="POST"
            action="{{ url_for('edit_event', event_id=event['id']) }}"
        >

            <!-- EVENT NAME -->

            <div class="form-group">

                <label for="name">
                    Event Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ event['name'] or '' }}"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                >{{ event['description'] or '' }}</textarea>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label for="date">
                    Event Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ event['date'] }}"
                    required
                >

            </div>


            <!-- TIME -->

            <div class="form-row">

                <div class="form-group">

                    <label for="start_time">
                        Start Time
                    </label>

                    <input
                        type="time"
                        id="start_time"
                        name="start_time"
                        value="{{ event['start_time'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="end_time">
                        End Time
                    </label>

                    <input
                        type="time"
                        id="end_time"
                        name="end_time"
                        value="{{ event['end_time'] }}"
                        required
                    >

                </div>

            </div>


            <!-- VENUE -->

            <div class="form-group">

                <label for="venue">
                    Venue
                </label>

                <select
                    id="venue"
                    name="venue"
                >

                    <option value="">
                        Select Venue
                    </option>

                    {% for venue in venues %}

                        <option
                            value="{{ venue['name'] }}"
                            {% if event['venue'] == venue['name'] %}
                                selected
                            {% endif %}
                        >
                            {{ venue['name'] }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- ORGANIZER -->

            <div class="form-group">

                <label for="organizer">
                    Organizer
                </label>

                <input
                    type="text"
                    id="organizer"
                    name="organizer"
                    value="{{ event['organizer'] or '' }}"
                    required
                >

            </div>


            <!-- MAX PARTICIPANTS -->

            <div class="form-group">

                <label for="max_participants">
                    Maximum Participants
                </label>

                <input
                    type="number"
                    id="max_participants"
                    name="max_participants"
                    value="{{ event['max_participants'] or '' }}"
                    min="1"
                >

            </div>

            <!-- EVENT BUDGET -->

<div class="form-group">

    <label for="budget">
        Event Budget *
    </label>

    <input
        type="number"
        id="budget"
        name="budget"
        value="{{ event['budget'] or 0 }}"
        min="0"
        step="0.01"
        placeholder="Example: 50000"
        required
    >

</div>


            <!-- BUTTONS -->

            <div class="event-actions">

                <button
                    type="submit"
                    class="btn"
                >
                    💾 Save Changes
                </button>


                <a
                    href="{{ url_for('events') }}"
                    class="btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
