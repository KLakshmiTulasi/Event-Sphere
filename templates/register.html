{% extends "base.html" %}

{% block title %}
Participant Registration - EventSphere
{% endblock %}


{% block content %}

<div class="form-container">

    <div class="form-header">

        <p class="section-label">
            PARTICIPANT MANAGEMENT
        </p>

        <h1>
            Participant Registration
        </h1>

        <p>
            Register for an EventSphere event.
        </p>

    </div>


    <form method="POST">


        <!-- EVENT -->

        <label for="event_id">
            Select Event *
        </label>

        <select
            id="event_id"
            name="event_id"
            required>

            <option value="">
                -- Select Event --
            </option>


            {% for event in events %}

                <option value="{{ event['id'] }}">

                    {{ event['name'] }}

                    -
                    {{ event['date'] }}

                </option>

            {% endfor %}

        </select>


        <!-- NAME -->

        <label for="name">
            Participant Name *
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter full name"
            required
        >


        <!-- EMAIL -->

        <label for="email">
            Email Address *
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >


        <!-- PHONE -->

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
        >


        <!-- BUTTONS -->

        <div class="form-buttons">

            <a
                href="{{ url_for('dashboard') }}"
                class="btn cancel-btn">

                Cancel

            </a>


            <button
                type="submit"
                class="btn">

                Register Participant

            </button>

        </div>


    </form>

</div>

{% endblock %}
