{% extends "base.html" %}

{% block title %}
EventSphere - Allocate Resource
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Allocate Resource</h1>

        <p>
            Allocate a resource to an event.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Resource
                </label>

                <input
                    type="text"
                    value="{{ resource['name'] }}"
                    readonly>

            </div>

            <div class="form-group">

                <label>
                    Available Quantity
                </label>

                <input
                    type="text"
                    value="{{ resource['available_quantity'] }}"
                    readonly>

            </div>

            <div class="form-group">

                <label for="event_id">
                    Select Event
                </label>

                <select
                    name="event_id"
                    id="event_id"
                    required>

                    <option value="">
                        -- Select Event --
                    </option>

                    {% for event in events %}

                        <option value="{{ event['id'] }}">
                            {{ event['name'] }}
                            -
                            {{ event['date'] }}
                            ({{ event['start_time'] }} - {{ event['end_time'] }})
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    name="quantity"
                    id="quantity"
                    min="1"
                    max="{{ resource['available_quantity'] }}"
                    required>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn">
                    Allocate Resource
                </button>

                <a
                    href="{{ url_for('resources') }}"
                    class="btn secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
