{% extends "base.html" %}

{% block title %}EventSphere - Add Notification{% endblock %}

{% block content %}

<div class="dashboard-page">

    <div class="dashboard-header">

        <div>
            <p class="section-label">EVENTSPHERE</p>
            <h1>Add Notification</h1>
            <p>Create an important event notification.</p>
        </div>

    </div>


    <div class="form-container">

        <form method="POST">

            <div class="form-group">

                <label for="event_id">
                    Event
                </label>

                <select
                    id="event_id"
                    name="event_id"
                    required
                >

                    <option value="">
                        Select Event
                    </option>

                    {% for event in events %}

                    <option value="{{ event['id'] }}">
                        {{ event['name'] }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="notification_type">
                    Notification Type
                </label>

                <select
                    id="notification_type"
                    name="notification_type"
                    required
                >

                    <option value="">
                        Select Notification Type
                    </option>

                    <option value="Registration Confirmation">
                        Registration Confirmation
                    </option>

                    <option value="Ticket Notification">
                        Ticket Notification
                    </option>

                    <option value="Event Reminder">
                        Event Reminder
                    </option>

                    <option value="Venue/Time Change">
                        Venue/Time Change
                    </option>

                    <option value="Cancellation">
                        Cancellation
                    </option>

                    <option value="Vendor Notification">
                        Vendor Notification
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Enter notification message"
                    required
                ></textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('notifications') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn"
                >
                    Add Notification
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
